
version: 1

products:
  - Nimbus Fibre
  - Nimbus ONT-5G
  - Nimbus Mesh
  - Nimbus Mobile
  - Nimbus TV Box

classes:
  - id: connectivity.intermittent
    name: Intermittent connection
    description: >
      Use when internet connectivity repeatedly drops, becomes unstable,
      or disconnects intermittently, but there is no clear evidence that
      the physical device or equipment is faulty. If the complaint provides
      evidence of a hardware fault such as overheating, damaged cables or
      ports, abnormal hardware indicators, or device failure, prefer
      device.hardware.
    products: [Nimbus Fibre, Nimbus ONT-5G]
    root_causes:
      - evening congestion on the shared node
      - line noise or a degraded fibre connector
      - firmware bug in the ONT
      - Wi-Fi channel interference
    examples:
      - "Internet keeps dropping every night around 8."
      - "My internet disconnects every few minutes but the router shows no signs of hardware failure."

  - id: connectivity.outage
    name: Complete outage
    description: >
      Use when the primary customer-facing problem is complete loss of
      connectivity or service. The service is unavailable, the customer
      cannot establish a connection, or the Internet is completely down.
      This category can apply even when the underlying cause is a fibre
      cut, local node failure, billing suspension, or provisioning error
      after a plan change. Do not classify an outage as device.hardware
      solely because the complaint mentions an ONT, router, LEDs, or a
      missing link light. Prefer device.hardware only when the complaint
      provides explicit evidence that the physical device itself is faulty.

    root_causes:
      - local node failure
      - fibre cut
      - provisioning error after plan change
      - service suspended due to billing
    examples:
      - "No internet since morning, red light on the box."

  - id: speed.degraded
    name: Slow speeds
    description: >
      Use when the connection is available but the observed network speed
      is significantly below the customer's expected or subscribed speed.
      Do not use this category when the primary problem is complete loss of
      connectivity or repeated disconnections.
    products: [Nimbus Fibre, Nimbus Mesh]
    root_causes:
      - fair-use throttling after data cap
      - faulty splitter or cabling
      - router too old for the plan speed
      - heavy background usage on the home network
    examples:
      - "I pay for 300 Mbps but never get more than 20."

  - id: wifi.coverage
    name: Wi-Fi coverage
    description: >
      Use when the primary problem is weak, unavailable, or unreliable
      Wi-Fi coverage in a particular area of the customer's home. Prefer
      device.hardware when there is clear evidence that the mesh node,
      router, cable, port, power adapter, or other physical equipment is
      faulty.
    products: [Nimbus Mesh, Nimbus ONT-5G]
    root_causes:
      - router placement
      - mesh node pairing lost
      - device stuck on the 2.4 GHz band
      - interference from neighbouring networks
    examples:
      - "Wi-Fi is dead in the bedroom."

  - id: billing.dispute
    name: Billing dispute
    description: >
      Use when the customer is questioning, disputing, or reporting an
      incorrect charge, invoice, fee, or billing amount.
    products: [Nimbus Fibre, Nimbus Mobile]
    root_causes:
      - proration error after plan change
      - duplicate charge
      - promotional discount expired
      - late fee applied after payment delay
    examples:
      - "I was charged twice this month."

  - id: account.provisioning
    name: Activation and provisioning
    description: >
      Use when the primary issue is an account or service provisioning
      workflow rather than a normal mobile-service problem. This includes
      a new Nimbus Fibre service whose activation is pending, queued, or
      incomplete; a missed installation appointment; a rejected number
      port-in; or an incorrectly provisioned plan. Do not classify Nimbus
      Mobile SIM activation, roaming activation, or VoLTE configuration as
      account.provisioning; those belong to voice.mobile in this taxonomy.
      Also do not use account.provisioning merely because the complaint
      mentions provisioning as a possible underlying cause of a complete
      connectivity outage.

    products: [Nimbus Fibre, Nimbus Mobile]
    root_causes:
      - activation stuck in the queue
      - wrong plan provisioned
      - number port-in rejected
      - installation appointment missed
    examples:
      - "My new connection was supposed to be active three days ago."
      - "My new mobile plan still shows the old data allowance."
      - "The installation appointment was missed and my service was never activated."

  - id: device.hardware
    name: Device fault
    description: >
      Use when the complaint provides evidence that the physical networking
      equipment itself is faulty. Strong evidence includes an explicitly
      reported hardware fault, a device that is dead or unresponsive,
      repeated abnormal device behavior, overheating, a damaged cable or
      port, power adapter failure, or persistent hardware-specific failure
      after normal troubleshooting. Do not classify every outage with an
      ONT, router, LED, or missing link light as device.hardware. If the
      complaint primarily describes complete loss of Internet service without
      establishing a physical hardware fault, use connectivity.outage.

    products: [Nimbus ONT-5G, Nimbus Mesh]
    root_causes:
      - ONT hardware fault
      - router overheating
      - power adapter failure
      - damaged cable or port
    examples:
      - "The router keeps rebooting and feels very hot."
      - "The ONT lights are off and the device appears to have failed."
      - "The mesh router is overheating and the cable port looks damaged."

  - id: voice.mobile
    name: Mobile voice and data
    description: >
      Use for Nimbus Mobile service problems involving calls, SMS, mobile
      data, SIM registration or activation, VoLTE, roaming, or mobile
      network availability. In this taxonomy, SIM activation incomplete,
      roaming not activated, and VoLTE not enabled are classified as
      voice.mobile even when the complaint uses words such as activation
      or configuration. Do not route a mobile complaint to
      account.provisioning merely because activation is mentioned.
      Use account.provisioning only when the complaint concerns an account
      or service provisioning workflow such as a wrong plan, number port-in,
      or a pending Fibre service activation.
      
    products: [Nimbus Mobile]
    root_causes:
      - VoLTE not enabled on the SIM
      - roaming not activated
      - SIM activation incomplete
      - weak coverage at the customer's location
    examples:
      - "I can't make calls indoors."
      - "My mobile data is not working even though my plan is active."

  # Held back: switched on live in the demo to show new classes need no retraining.
  - id: tv.streaming
    name: TV and streaming
    description: Set-top box, buffering or streaming app problems.
    status: held_back
    products: [Nimbus TV Box]
    root_causes:
      - set-top box needs a firmware update
      - buffering caused by a weak line
      - streaming app login failure
      - remote not paired
    examples:
      - "My TV box freezes during movies."

  - id: security.fraud
    name: Security and fraud
    description: Suspected SIM swap, account takeover or suspicious usage.
    status: held_back
    products: [Nimbus Mobile, Nimbus Fibre]
    root_causes:
      - SIM swap without the customer's consent
      - unauthorized plan change
      - suspicious roaming usage
      - phishing message impersonating the operator
    examples:
      - "My phone lost signal and I got messages about a new SIM."
