services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexolve-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexolve-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
